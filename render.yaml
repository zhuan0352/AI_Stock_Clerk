# Render blueprint: https://render.com/docs/blueprint-spec
# New > Blueprint in the Render dashboard, pick this repo, then paste the keys.
services:
  - type: web
    name: stock-clerk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --proxy-headers so Stripe redirects back to https:// (Render terminates TLS)
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/status
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
